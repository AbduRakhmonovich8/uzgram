<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Uzgram Add Member">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2AABEE"></stop>
      <stop offset="100%" stop-color="#1E88E5"></stop>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"></feDropShadow>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"></rect>

  <!-- Main group (two people) -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Back person -->
    <circle cx="210" cy="220" r="52" opacity="0.92"></circle>
    <path d="M128 352c0-52 40-86 82-86s82 34 82 86v18H128z" opacity="0.92"></path>

    <!-- Front person -->
    <circle cx="292" cy="206" r="62"></circle>
    <path d="M182 360c0-62 50-102 110-102s110 40 110 102v26H182z"></path>
  </g>

  <!-- Add (+) badge -->
  <g filter="url(#shadow)">
    <circle cx="372" cy="356" r="66" fill="#00E676"></circle>
    <path d="M372 316v80M332 356h80" stroke="#0B3D1B" stroke-width="18" stroke-linecap="round" opacity="0.18"></path>
    <path d="M372 318v76M334 356h76" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"></path>
  </g>

  <!-- UZ label -->
  <g filter="url(#shadow)">
    <rect x="86" y="94" width="150" height="76" rx="24" fill="#FFFFFF" opacity="0.18"></rect>
    <text x="110" y="146" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="2">
      UZ
    </text>
  </g>
</svg>
